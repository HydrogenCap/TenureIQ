name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Not left to @prisma/client's postinstall: with a warm pnpm cache
      # the side-effects cache skips it and the typed client never
      # materialises (bit us in run #6).
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        # next lint loads next.config.ts, which runs the t3-env schema —
        # needs the same dummy env the Build step uses.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key_for_build
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: dummy_service_role_for_build
          DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:54322/postgres
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Schema-column audit
        run: python3 scripts/audit-select-columns.py

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key_for_build
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: dummy_service_role_for_build
          DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:54322/postgres
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm exec prisma generate
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start Supabase
        run: pnpm supabase:start
      - name: Migrate and seed
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: Playwright (tenant isolation suite is the must-pass)
        run: pnpm test:e2e
