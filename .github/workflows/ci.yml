name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Not left to @prisma/client's postinstall: with a warm pnpm cache
      # the side-effects cache skips it and the typed client never
      # materialises (bit us in run #6).
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        # next lint loads next.config.ts, which runs the t3-env schema —
        # needs the same dummy env the Build step uses.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key_for_build
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: dummy_service_role_for_build
          DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:54322/postgres
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Schema-column audit
        run: python3 scripts/audit-select-columns.py

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key_for_build
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: dummy_service_role_for_build
          DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:54322/postgres
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm exec prisma generate
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start Supabase
        run: pnpm supabase:start
      # supabase start has already applied supabase/migrations (the
      # byte-identical copy of prisma/migrations), so no prisma migrate
      # here — `prisma migrate dev` against the already-migrated DB would
      # detect drift and demand a reset. The e2e specs self-seed through
      # tests/factories with the service role.
      - name: Export Supabase env
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "DATABASE_URL=${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}"
            echo "DIRECT_URL=${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL:-http://127.0.0.1:54321}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "CRON_SECRET=ci-cron-secret"
          } >> "$GITHUB_ENV"
      - name: Playwright (tenant isolation suite is the must-pass)
        run: pnpm test:e2e
